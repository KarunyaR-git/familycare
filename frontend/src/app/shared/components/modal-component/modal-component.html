<div class="modal">

  <div class="modal-header">
    <h2>{{ title }}</h2>

    <button
      type="button"
      class="modal-close"
      (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="modal-content">
    <ng-content select="[modal-body]"></ng-content>
  </div>

  <div class="modal-footer">
    <ng-content select="[modal-footer]"></ng-content>
  </div>

</div>
