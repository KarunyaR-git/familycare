<div class="date-time-container">

  @if (label) {
    <label class="date-time-label">
      {{ label }}
      
      @if(required){
            <span class="required">*</span>
      }
    </label>
  }

  <input
    [type]="type"
    class="date-time-input"
    [value]="value"
    [min]="min"
    [max]="max"
    [disabled]="disabled"
    (input)="onValueChange($event)"
    (blur)="onBlur()"
  />

</div>
