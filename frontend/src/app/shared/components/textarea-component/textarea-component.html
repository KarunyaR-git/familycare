<div class="textarea-container">

  @if (label) {
    <label class="textarea-label">
      {{ label }}
    </label>
  }

  <textarea
    class="textarea-input"
    [value]="value"
    [placeholder]="placeholder"
    [rows]="rows"
    [disabled]="disabled"
    (input)="onValueChange($event)"
    (blur)="onBlur()">
  </textarea>

</div>
