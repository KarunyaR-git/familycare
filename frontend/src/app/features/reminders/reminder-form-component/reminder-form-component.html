<app-modal-component
  [title]="data.mode === 'create' ? 'Add Reminder' : 'Edit Reminder'"
  (closeModal)="onCancel()">

  <form
    modal-body
    [formGroup]="reminderForm"
    class="reminder-form">

    <app-input-component
      label="Title"
      [required]="true"
      formControlName="title"
      [errorMessage]="getErrorMessage('title')">
    </app-input-component>

    <app-textarea-component
      label="Description"
      placeholder="Enter reminder description"
      [rows]="4"
      formControlName="description">
    </app-textarea-component>

    <app-date-time-component
      label="Reminder At"
      [required] = "true"
      formControlName="reminderAt"
      [errorMessage]="getErrorMessage('reminderAt')">
    </app-date-time-component>

    <app-input-component
      label="Reminder Before"
      type="number"
      formControlName="reminderBefore"
      [errorMessage]="getErrorMessage('reminderBefore')">
    </app-input-component>

    <app-dropdown-component
      label="Status"
      placeholder="Select status"
      [options]="statusLists"
      formControlName="status">
    </app-dropdown-component>

  </form>

  <div modal-footer class="form-actions">
    <app-button-component
      type="button"
      text="Cancel"
      (clicked)="onCancel()">
    </app-button-component>

    <app-button-component
      type="submit"
      [text]="data.mode === 'create' ? 'Add' : 'Update'"
      [disabled]="isDisabled" 
      [loading]="isLoading()"
      (clicked)="onSubmit()">
    </app-button-component>
  </div>

</app-modal-component>
