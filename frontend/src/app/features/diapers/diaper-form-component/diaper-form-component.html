<app-modal-component
  [title]="data.mode === 'create' ? 'Add Diaper' : 'Edit Diaper'"
  (closeModal)="onCancel()">

  <form
    modal-body
    [formGroup]="diaperForm"
    class="diaper-form">

    <app-dropdown-component
      label="Type"
      placeholder="Select type"
      [required]="true"
      [options]="typeLists"
      formControlName="type">
    </app-dropdown-component>

    <app-date-time-component
      label="Changed At"
      [required] = "true"
      [blockFuture]="true"
      formControlName="changedAt"
      [errorMessage]="getErrorMessage('changedAt')">
    </app-date-time-component>

    <app-textarea-component
      label="Notes"
      placeholder="Enter notes"
      [rows]="4"
      formControlName="notes">
    </app-textarea-component>

  </form>

  <div modal-footer class="form-actions">
    <app-button-component
      type="button"
      text="Cancel"
      (clicked)="onCancel()">
    </app-button-component>

    <app-button-component
      type="submit"
      [text]="data.mode === 'create' ? 'Add' : 'Update'"
      [disabled]="isDisabled" 
      [loading]="isLoading()"
      (clicked)="onSubmit()">
    </app-button-component>
  </div>

</app-modal-component>
